syntax = "proto3";
package chitchat;

service ChitchatService {
  rpc Session(stream ClientMessage) returns (stream ServerMessage);
}

message ClientMessage {
  string request_id = 1;
  oneof payload {
    RegisterRequest     register = 2;
    ListSessionsRequest list     = 3;
    SendMessageRequest  send     = 4;
    ChangeNameRequest   change   = 5;
  }
}

message ServerMessage {
  string request_id = 1;
  oneof payload {
    RegisterResponse     registered   = 2;
    ListSessionsResponse sessions     = 3;
    SendMessageResponse  sent         = 4;
    ChangeNameResponse   name_changed = 5;
    IncomingMessage      incoming     = 6;
    ErrorResponse        error        = 7;
  }
}

message RegisterRequest     { string name     = 1; }
message RegisterResponse    { string name     = 1; }
message ListSessionsRequest {}
message ListSessionsResponse { repeated string names = 1; }
message SendMessageRequest  { string to = 1; string message = 2; }
message SendMessageResponse {}
message ChangeNameRequest   { string new_name = 1; }
message ChangeNameResponse  { string name = 1; }
message IncomingMessage     { string from = 1; string message = 2; }
message ErrorResponse       { string message = 1; }
